name: Atlas AI APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Capacitor bağımlılıklarını kur
        run: npm ci

      - name: Capacitor senkronizasyonu
        run: npx cap sync android

      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/atlas-ai.keystore
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
          else
            PW=$(openssl rand -hex 16)
            echo "::add-mask::$PW"
            keytool -genkeypair -keystore android/app/atlas-ai.keystore -alias atlasai -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PW" -keypass "$PW" -dname "CN=Atlas AI, O=Atlas AI, C=TR"
            echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          fi

      - name: APK derle
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../Atlas-AI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Atlas-AI-apk
          path: Atlas-AI.apk

      - name: GitHub Release olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Atlas AI v1.0.${{ github.run_number }}
          body: |
            Atlas AI Android uygulaması. Telefona indirmek için aşağıdaki **Atlas-AI.apk** dosyasına dokunun.
          files: Atlas-AI.apk
          make_latest: true
